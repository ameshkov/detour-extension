<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Detour</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body data-page="popup">
    <header data-role="header">
      <span data-role="mark" aria-hidden="true"><img src="logo-mark.png" alt="" /></span>
      <span data-role="wordmark">Detour</span>
      <span data-role="state"></span>
      <input data-role="enabled" type="checkbox" role="switch" />
    </header>
    <main>
      <section data-role="site" hidden>
        <p data-role="site-row">
          <span data-role="site-text"></span>
        </p>
        <p data-role="site-walls" hidden></p>
        <a data-role="site-report" target="_blank" rel="noreferrer noopener" hidden></a>
        <button data-role="site-alternatives" type="button" hidden>
          <span data-role="site-alternatives-label"></span
          ><span class="chevron" aria-hidden="true">›</span>
        </button>
      </section>
      <div data-role="pause-row">
        <button data-role="pause" type="button" aria-expanded="false">
          <span data-role="pause-label"></span
          ><span data-role="pause-chevron" class="chevron" aria-hidden="true">›</span>
        </button>
        <button data-role="resume" type="button" hidden></button>
      </div>
      <div data-role="durations" hidden>
        <button data-role="duration-5m" type="button"></button>
        <button data-role="duration-30m" type="button"></button>
        <button data-role="duration-1h" type="button"></button>
        <button data-role="duration-today" type="button">
          <span data-role="duration-today-label"></span
          ><span data-role="duration-today-note"></span>
        </button>
        <button data-role="duration-session" type="button"></button>
      </div>
      <button data-role="settings" type="button">
        <span data-role="settings-label"></span><span class="chevron" aria-hidden="true">›</span>
      </button>
    </main>
    <footer>
      <a data-role="how-it-works" target="_blank" rel="noreferrer noopener"></a>
      <a data-role="privacy" target="_blank" rel="noreferrer noopener"></a>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
