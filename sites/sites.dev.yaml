# The local overlay. Only pnpm list:build:dev reads this file, and it adds these
# entries to the release artifact. A publisher never enters this file. The
# overlay uses the shape of the served list, so it carries no editorial fields.
sites:
  - domain: 127.0.0.1
    name: Local fixture
    verified: 2026-11-20
    walls:
      - category: adblock
        type: hard
      - category: paywall
        type: metered
    paths: ['/walled/*']
    note: An ad-blocker card covers the fixture page until the reader allows ads, and a metered paywall follows it.
