name: pages

# The site in `website/` is the public page of the extension and its privacy
# policy. A push that changes it builds it again; nothing is deployed by hand.
on:
  push:
    branches:
      - master
    paths:
      - 'website/**'
      - 'docs/privacy.md'
      - 'store/assets/icon-128.png'
      - 'store/assets/screenshot-block.png'
      - 'packages/extension/src/logo-mark.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install the dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the site
        run: pnpm site:build

      - name: Pack the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
